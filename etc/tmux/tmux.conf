# ~/.tmux.conf

# -----------------------------------------------------------------------------
# 1. Shell & Environment Bootstrap
# -----------------------------------------------------------------------------
# Use default shell to `nu`
if-shell 'which nu' 'set -g default-command nu'

# Critical: Zero delay on Escape key (vital for modal editing in Neovim)
set-option -gs escape-time 0

# True color & modern terminal features support (Kitty, Alacritty, Windows Terminal)
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-kitty:RGB,xterm-256color:RGB'

# Enable OSC 52 clipboard passthrough across SSH and WSL2
set-option -s set-clipboard on

# Notify Neovim on pane focus shifts (triggers autowrite/autoread)
set-option -g focus-events on

# History & responsiveness
set-option -g history-limit 32768
set-option -g status-interval 4



# -----------------------------------------------------------------------------
# 2. Keybindings & Navigation Ergonomics
# -----------------------------------------------------------------------------
# Command prefix: Alt-x (M-x)
set-option -g prefix M-x
unbind-key C-b
bind-key M-x last-window
bind-key 's' send-prefix

# Start numbering from 1 (matches keyboard layout) and renumber automatically
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g renumber-windows on

# Mouse & vi mode
set-window-option -g mouse on
set-window-option -g mode-keys vi
set-window-option -g xterm-keys on

# Copy-mode bindings
unbind-key '['
bind-key Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Config reload: uses current file buffer or falls back cleanly
unbind-key 'r'
bind-key 'r' run-shell 'tmux source-file "#{config_files}" && tmux display "Config reloaded!"'

# Clean Splits: Keep current working directory
unbind-key '"'
unbind-key '%'
bind-key + split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Seamless pane navigation (Alt + Arrows & vim-keys)
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Down  select-pane -D
bind-key -n M-Up    select-pane -U

bind-key 'h' select-pane -L
bind-key 'j' select-pane -D
bind-key 'k' select-pane -U
bind-key 'l' select-pane -R

# Window navigation (Alt + PageUp/PageDown & Ctrl + b/f)
bind-key -n M-PgUp previous-window
bind-key -n M-PgDn next-window
bind-key C-b previous-window
bind-key C-f next-window

# -----------------------------------------------------------------------------
# 3. Visuals: High-Contrast, Transparent Background (Slate integration)
# -----------------------------------------------------------------------------
set-option -g status on
set-option -g status-keys 'vi'

# Transparent background to match Neovim and terminal settings
set-option -g status-style 'bg=default,fg=#c0c0c0'

# Left status: Session indicator with distinct badge on remote SSH
set-option -g status-left-length 30
set-option -g status-left "#{?SSH_CONNECTION,#[fg=#ff9e64,bold][SSH:#S] ,#[fg=#9ccfd8,bold][#S] }"

# Right status: Compact Date and Host
set-option -g status-right-length 40
set-option -g status-right '#[fg=#808080]%Y-%m-%d %H:%M #[fg=#c4a7e7]#H '

# Window tabs formatting (high contrast, zero visual clutter)
set-option -g window-status-separator ''
set-option -g window-status-format '#[fg=#808080,bg=default] #I:#W '
set-option -g window-status-current-format '#[fg=#ffffff,bold,bg=#383838] #I:#W#F '

# Subtle pane borders
set-option -g pane-border-style 'fg=#404040'
set-option -g pane-active-border-style 'fg=#9ccfd8'
